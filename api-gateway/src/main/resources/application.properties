spring.application.name=api-gateway
server.port=8080

### JWT (meme secret que auth-service) ###
jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me-0123}
gateway.auth.enabled=${GATEWAY_AUTH_ENABLED:true}

### EUREKA ###
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

### ROUTES ###
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=lb://product-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/stock/**,/produit/**,/categorieProduit/**
spring.cloud.gateway.routes[2].id=supplier-service
spring.cloud.gateway.routes[2].uri=lb://supplier-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/fournisseur/**,/secteurActivite/**
spring.cloud.gateway.routes[3].id=invoice-service
spring.cloud.gateway.routes[3].uri=lb://invoice-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/facture/**,/reglement/**,/operateur/**
