services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306"          # 3307 cote machine, pour ne pas gener un MySQL local
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  eureka-server:
    build:
      context: .
      args:
        MODULE: eureka-server
    ports:
      - "8761:8761"

  auth-service:
    build:
      context: .
      args:
        MODULE: auth-service
    ports:
      - "8084:8084"
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/authdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_URL: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-0123}
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  product-service:
    build:
      context: .
      args:
        MODULE: product-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/productdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_URL: http://eureka-server:8761/eureka
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  supplier-service:
    build:
      context: .
      args:
        MODULE: supplier-service
    ports:
      - "8082:8082"
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/supplierdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_URL: http://eureka-server:8761/eureka
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  invoice-service:
    build:
      context: .
      args:
        MODULE: invoice-service
    ports:
      - "8083:8083"
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/invoicedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_URL: http://eureka-server:8761/eureka
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-change-me-change-me-change-me-change-me-0123}
    depends_on:
      eureka-server:
        condition: service_started
      auth-service:
        condition: service_started

volumes:
  mysql-data:
