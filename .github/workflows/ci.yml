name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, test, prod, main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      # Compile tous les modules et lance leurs tests (base H2 en memoire, pas besoin de MySQL)
      - name: Build + tests
        run: ./mvnw -B clean verify
